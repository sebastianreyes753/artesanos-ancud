<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Oficios | Artesanos de Ancud</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=17zcF4Qc9yRwIVoauzdQVPPr6f3JUfLmI&sz=w32">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --hueso: #F9F7F2; --madera: #5D4037; --tierra: #B5835A; --texto: #4A443F; --blanco: #ffffff; --shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { height: 100%; margin: 0; display: flex; flex-direction: column; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--hueso); color: var(--texto); line-height: 1.8; }
        main { flex: 1; }
        
        h1, h2, h3 { font-family: 'Lora', serif; color: var(--madera); }
        
        /* --- NAVEGACIÓN UNIFICADA (INDEX) --- */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 0 5%; height: 85px; background-color: rgba(249, 247, 242, 0.98); position: sticky; top: 0; z-index: 2000; border-bottom: 2px solid #E5DED1; box-shadow: var(--shadow); }
        .logo-container { display: flex; align-items: center; text-decoration: none; color: var(--madera); z-index: 2001; }
        .logo-img { height: 60px; margin-right: 12px; }
        .logo-container strong { font-size: 1.1rem; letter-spacing: 1px; }
        .nav-links { display: flex; list-style: none; align-items: center; }
        .nav-links li { margin-left: 25px; position: relative; }
        .nav-links a { text-decoration: none; color: var(--madera); font-weight: 600; font-size: 0.9rem; transition: 0.3s; text-transform: uppercase; }
        .nav-links a:hover { color: var(--tierra); }
        
        /* Dropdown Estilizado */
        .dropdown-content { display: none; position: absolute; background: var(--blanco); min-width: 200px; top: 100%; left: 0; box-shadow: var(--shadow); border-radius: 4px; padding: 10px 0; border-top: 3px solid var(--tierra); }
        .dropdown-content a { padding: 10px 20px; display: block; text-transform: none; font-size: 0.85rem; color: var(--texto); }
        .dropdown-content a:hover { background-color: var(--hueso); color: var(--tierra); }
        .dropdown:hover .dropdown-content { display: block; }
        
        /* Menu Hamburguesa */
        .hamburger { display: none; cursor: pointer; flex-direction: column; gap: 5px; z-index: 2001; }
        .hamburger span { width: 28px; height: 3px; background: var(--madera); border-radius: 2px; transition: 0.3s; }
        
        /* Encabezado de Galería */
        .gallery-header { padding: 80px 5% 40px; text-align: center; background: linear-gradient(to bottom, #f2ede4, var(--hueso)); }
        .gallery-header h1 { font-size: 3rem; margin-bottom: 15px; }
        .gallery-header p { max-width: 700px; margin: 0 auto; color: #666; font-size: 1.1rem; }

        /* Cuadrícula de Galería */
        .gallery-container { padding: 40px 5% 100px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; max-width: 1200px; margin: 0 auto; }
        
        .gallery-card { 
            background: var(--blanco); 
            border-radius: 15px; 
            overflow: hidden; 
            box-shadow: var(--shadow); 
            transition: transform 0.4s ease, border-color 0.3s; 
            cursor: pointer;
            border: 1px solid #E5DED1;
        }
        .gallery-card:hover { transform: translateY(-10px); border-color: var(--tierra); }
        .image-box { width: 100%; height: 400px; overflow: hidden; position: relative; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .gallery-card:hover .image-box img { transform: scale(1.1); }
        .info-box { padding: 25px; text-align: center; }
        .info-box h3 { margin-bottom: 10px; font-size: 1.4rem; }
        .info-box p { font-size: 0.95rem; color: #777; font-style: italic; }
        .info-box .read-more { display: block; margin-top: 15px; color: var(--tierra); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }

        /* --- MODALES (VENTANAS EMERGENTES) --- */
        .modal { 
            display: none; position: fixed; z-index: 3000; left: 0; top: 0; 
            width: 100%; height: 100%; background-color: rgba(93, 64, 55, 0.85); 
            backdrop-filter: blur(4px); 
        }
        .modal-content { 
            background-color: var(--hueso); margin: 5vh auto; padding: 40px; 
            width: 90%; max-width: 700px; border-radius: 12px; position: relative; 
            max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
            border-top: 6px solid var(--tierra); 
        }
        .close-modal { position: absolute; right: 25px; top: 15px; font-size: 35px; cursor: pointer; color: var(--madera); font-weight: bold; }
        .modal-body img { width: 100%; height: 350px; object-fit: cover; border-radius: 8px; margin-bottom: 25px; }
        .modal-body h2 { margin-bottom: 5px; }
        .modal-body .artesano-author { color: var(--tierra); font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; display: block; }
        .modal-body p { margin-bottom: 15px; font-size: 1.05rem; color: var(--texto); line-height: 1.7; }
        .modal-body blockquote { font-style: italic; border-left: 4px solid var(--tierra); padding-left: 15px; margin: 20px 0; color: #555; }

        /* --- FOOTER UNIFICADO (INDEX) --- */
        footer { background: var(--madera); color: var(--hueso); padding: 50px 5% 30px; text-align: center; }
        .footer-line { width: 100%; height: 1px; background: rgba(255,255,255,0.1); margin: 25px 0; }

        /* Responsive */
        @media (max-width: 992px) {
            .hamburger { display: flex; }
            .nav-links { position: fixed; top: 0; left: -100%; width: 80%; height: 100vh; background: var(--hueso); flex-direction: column; padding-top: 100px; transition: 0.4s; box-shadow: 10px 0 30px rgba(0,0,0,0.1); }
            .nav-links.active { left: 0; }
            .nav-links li { margin: 20px 0; width: 100%; text-align: center; }
            .dropdown-content { position: static; box-shadow: none; background: transparent; display: block; border: none; }
            .gallery-header h1 { font-size: 2.2rem; }
            .image-box { height: 300px; }
            .modal-content { padding: 25px; margin-top: 8vh; }
            .modal-body img { height: 250px; }
        }
    </style>
</head>
