<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Oficios | Artesanos de Ancud</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=17zcF4Qc9yRwIVoauzdQVPPr6f3JUfLmI&sz=w32">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --hueso: #F9F7F2; --madera: #5D4037; --tierra: #B5835A; --texto: #4A443F; --blanco: #ffffff; --shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { height: 100%; margin: 0; display: flex; flex-direction: column; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--hueso); color: var(--texto); line-height: 1.8; }
        main { flex: 1; }
        
        h1, h2, h3 { font-family: 'Lora', serif; color: var(--madera); }
        
        /* --- NAVEGACIÓN UNIFICADA --- */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 0; padding-right: 5%; height: 85px; background-color: rgba(249, 247, 242, 0.98); position: sticky; top: 0; z-index: 2000; border-bottom: 2px solid #E5DED1; box-shadow: var(--shadow); }
        .logo-container { display: flex; align-items: center; text-decoration: none; color: var(--madera); z-index: 2001; }
        .logo-img { height: 85px; margin-right: 12px; }
        .logo-container strong { font-size: 1.1rem; letter-spacing: 1px; }
        .nav-links { display: flex; list-style: none; align-items: center; }
        .nav-links li { margin-left: 25px; position: relative; }
        .nav-links a { text-decoration: none; color: var(--madera); font-weight: 600; font-size: 0.9rem; transition: 0.3s; text-transform: uppercase; }
        .nav-links a:hover { color: var(--tierra); }
        
        /* Dropdown Estilizado */
        .dropdown-content { display: none; position: absolute; background: var(--blanco); min-width: 200px; top: 100%; left: 0; box-shadow: var(--shadow); border-radius: 4px; padding: 10px 0; border-top: 3px solid var(--tierra); }
        .dropdown-content a { padding: 10px 20px; display: block; text-transform: none; font-size: 0.85rem; color: var(--texto); }
        .dropdown-content a:hover { background-color: var(--hueso); color: var(--tierra); }
        .dropdown:hover .dropdown-content { display: block; }
        
        /* Menu Hamburguesa */
        .hamburger { display: none; cursor: pointer; flex-direction: column; gap: 5px; z-index: 2001; }
        .hamburger span
