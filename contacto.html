<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Artesanos de Ancud</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=17zcF4Qc9yRwIVoauzdQVPPr6f3JUfLmI&sz=w32">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --hueso: #F9F7F2; --madera: #5D4037; --tierra: #B5835A; --texto: #4A443F; --blanco: #ffffff; --shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { height: 100%; margin: 0; display: flex; flex-direction: column; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--hueso); color: var(--texto); line-height: 1.8; }
        main { flex: 1; }

        h1, h2, h3 { font-family: 'Lora', serif; color: var(--madera); }
        
        /* --- NAVEGACIÓN UNIFICADA (INDEX) --- */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 0 5%; height: 85px; background-color: rgba(249, 247, 242, 0.98); position: sticky; top: 0; z-index: 2000; border-bottom: 2px solid #E5DED1; box-shadow: var(--shadow); }
        .logo-container { display: flex; align-items: center; text-decoration: none; color: var(--madera); z-index: 2001; }
        .logo-img { height: 60px; margin-right: 12px; }
        .logo-container strong { font-size: 1.1rem; letter-spacing: 1px; }
        .nav-links { display: flex; list-style: none; align-items: center; }
        .nav-links li { margin-left: 25px; position: relative; }
        .nav-links a { text-decoration: none; color: var(--madera); font-weight: 600; font-size: 0.9rem; transition: 0.3s; text-transform: uppercase; }
        .nav-links a:hover { color: var(--tierra); }
        
        /* Dropdown Estilizado */
        .dropdown-content { display: none; position: absolute; background: var(--blanco); min-width: 200px; top: 100%; left: 0; box-shadow: var(--shadow); border-radius: 4px; padding: 10px 0; border-top: 3px solid var(--tierra); }
        .dropdown-content a { padding: 10px 20px; display: block; text-transform: none; font-size: 0.85rem; color: var(--texto); }
        .dropdown-content a:hover { background-color: var(--hueso); color: var(--tierra); }
        .dropdown:hover .dropdown-content { display: block; }
        
        /* Menu Hamburguesa */
        .hamburger { display: none; cursor: pointer; flex-direction: column; gap: 5px; z-index: 2001; }
        .hamburger span { width: 28px; height: 3px; background: var(--madera); border-radius: 2px; transition: 0.3s; }

        /* Sección Contacto */
        section { padding: 60px 5%; text-align: center; }
        .contact-logo-box { margin-bottom: 20px; }
        .contact-logo { height: 120px; width: auto; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
        h2 { font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { color: #777; margin-bottom: 40px; font-style: italic; }
        
        .contact-container { width: 100%; max-width: 600px; background: var(--blanco); padding: 40px; border-radius: 12px; box-shadow: var(--shadow); text-align: left; margin: 0 auto; border-top: 5px solid var(--tierra); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--madera); }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #E5DED1; border-radius: 8px; font-family: inherit; background-color: #fdfdfd; }
        .form-group input:focus, .form-group textarea:focus { outline: 2px solid var(--tierra); border-color: transparent; }
        
        .btn-warm { display: inline-block; padding: 15px 40px; background-color: var(--tierra); color: white; text-decoration: none; border-radius: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; border: none; cursor: pointer; width: 100%; }
        .btn-warm:hover { background-color: var(--madera); transform: translateY(-2px); }

        /* --- FOOTER UNIFICADO (INDEX) --- */
        footer { background: var(--madera); color: var(--hueso); padding: 50px 5% 30px; text-align: center; }
        .footer-line { width: 100%; height: 1px; background: rgba(255,255,255,0.1); margin: 25px 0; }

        @media (max-width: 992px) {
            .hamburger { display: flex; }
            .nav-links { position: fixed; top: 0; left: -100%; width: 80%; height: 100vh; background: var(--hueso); flex-direction: column; padding-top: 100px; transition: 0.4s; box-shadow: 10px 0 30px rgba(0,0,0,0.1); }
            .nav-links.active { left: 0; }
            .nav-links li { margin: 20px 0; width: 100%; text-align: center; }
            .dropdown-content { position: static; box-shadow: none; background: transparent; display: block; border: none; }
            .contact-container { padding: 25px; }
        }
    </style>
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo-container">
        <img src="https://drive.google.com/thumbnail?id=17zcF4Qc9yRwIVoauzdQVPPr6f3JUfLmI&sz=w500" alt="Logo" class="logo-img">
        <strong>ARTESANOS DE ANCUD</strong>
    </a>
    
    <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
    </div>

    <nav>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li class="dropdown">
                <a href="artesanos.html">Artesanos ▼</a>
                <div class="dropdown-content">
                    <a href="index.html#nosotros">Nuestra Misión</a>
                    <a href="artesanos.html">Galería de Oficios</a>
                </div>
            </li>
            <li><a href="noticias.html">Noticias</a></li>
            <li><a href="contacto.html" style="color: var(--tierra);">Contacto</a></li>
        </ul>
    </nav>
</header>

<main>
    <section>
        <div class="contact-logo-box">
            <img src="https://drive.google.com/thumbnail?id=17zcF4Qc9yRwIVoauzdQVPPr6f3JUfLmI&sz=w1000" alt="Logo Artesanos" class="contact-logo">
        </div>

        <h2>Contacto</h2>
        <p class="subtitle">¿Tienes consultas sobre la muestra o nuestros oficios? Escríbenos.</p>
        
        <div class="contact-container">
            <form action="#" method="POST">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" name="name" placeholder="Ej: Juan Pérez" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" name="email" placeholder="nombre@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Mensaje</label>
                    <textarea name="message" rows="5" placeholder="Cuéntanos en qué podemos ayudarte..." required></textarea>
                </div>
                <button type="submit" class="btn-warm">Enviar Mensaje :D</button>
            </form>
        </div>
    </section>
</main>

<footer>
    <div style="max-width: 800px; margin: 0 auto;">
        <p><strong>Copyright © 2026 Agrupación de Artesanos y Oficios de Ancud</strong></p>
        <div class="footer-line"></div>
        <p style="font-size: 0.8rem; opacity: 0.7;">Diseñado por Sebastián Reyes Caimapo</p>
    </div>
</footer>

<script>
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('nav-links');

    hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
        const spans = hamburger.querySelectorAll('span');
        spans[0].style.transform = navLinks.classList.contains('active') ? 'rotate(45deg) translate(5px, 5px)' : 'none';
        spans[1].style.opacity = navLinks.classList.contains('active') ? '0' : '1';
        spans[2].style.transform = navLinks.classList.contains('active') ? 'rotate(-45deg) translate(7px, -6px)' : 'none';
    });

    document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
            navLinks.classList.remove('active');
        });
    });
</script>
</body>
</html>
